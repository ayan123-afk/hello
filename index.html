<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mashallah Boutique - Premium Modest Fashion</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        /* E-commerce Theme */
        :root {
            --primary: #e63946;
            --primary-dark: #d62828;
            --secondary: #2a9d8f;
            --dark: #1a1a2e;
            --light: #f8f9fa;
            --light-gray: #e9ecef;
            --gradient: linear-gradient(135deg, #e63946 0%, #ff6b6b 100%);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            --shadow-hover: 0 20px 50px rgba(230, 57, 70, 0.15);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #fefefe;
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
        }

        /* Navigation */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 1.2rem 4rem;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.05);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 3px solid var(--primary);
        }

        .navbar h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 2rem;
            font-weight: 900;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .navbar-right {
            display: flex;
            align-items: center;
            gap: 1.8rem;
        }

        .nav-link {
            color: var(--dark);
            text-decoration: none;
            font-weight: 500;
            padding: 0.7rem 1.5rem;
            border-radius: 8px;
            transition: var(--transition);
            position: relative;
        }

        .nav-link:hover {
            color: var(--primary);
            background: rgba(230, 57, 70, 0.05);
        }

        .nav-link.active {
            color: var(--primary);
            font-weight: 600;
            background: rgba(230, 57, 70, 0.05);
        }

        .cart-btn {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.8rem 1.8rem;
            background: var(--gradient);
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
            position: relative;
            box-shadow: 0 5px 20px rgba(230, 57, 70, 0.2);
        }

        .cart-btn:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
        }

        #cart-count {
            background: white;
            color: var(--primary);
            font-size: 0.9rem;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            top: -8px;
            right: -8px;
            font-weight: 700;
        }

        .checkout-link {
            padding: 0.8rem 1.8rem;
            background: var(--dark);
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
            box-shadow: 0 5px 20px rgba(26, 26, 46, 0.2);
        }

        .checkout-link:hover {
            background: #151525;
            transform: translateY(-3px);
        }

        /* Hero Banner */
        .hero-banner {
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), 
                        url('https://images.unsplash.com/photo-1445205170230-053b83016050?ixlib=rb-4.0.3&auto=format&fit=crop&w=1800&q=80');
            background-size: cover;
            background-position: center;
            color: white;
            padding: 8rem 2rem;
            text-align: center;
            margin-bottom: 4rem;
        }

        .hero-banner h2 {
            font-family: 'Montserrat', sans-serif;
            font-size: 3.5rem;
            margin-bottom: 1.5rem;
            font-weight: 800;
        }

        .hero-banner p {
            font-size: 1.3rem;
            max-width: 700px;
            margin: 0 auto 2.5rem;
            opacity: 0.9;
        }

        .cta-button {
            display: inline-block;
            padding: 1.2rem 3rem;
            background: var(--gradient);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1.2rem;
            transition: var(--transition);
            box-shadow: 0 8px 30px rgba(230, 57, 70, 0.3);
        }

        .cta-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(230, 57, 70, 0.4);
        }

        /* Products Grid */
        .main-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem 6rem;
        }

        .section-title {
            text-align: center;
            font-family: 'Montserrat', sans-serif;
            font-size: 2.5rem;
            margin-bottom: 3rem;
            color: var(--dark);
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2.5rem;
            margin-top: 2rem;
        }

        .product-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: var(--transition);
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-12px);
            box-shadow: var(--shadow-hover);
        }

        .product-image {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-bottom: 1px solid var(--light-gray);
        }

        .product-info {
            padding: 2rem;
        }

        .product-name {
            font-weight: 600;
            font-size: 1.3rem;
            margin-bottom: 0.8rem;
            color: var(--dark);
        }

        .product-price {
            color: var(--primary);
            font-weight: 700;
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .product-price::before {
            content: 'PKR ';
            font-size: 1rem;
            opacity: 0.8;
        }

        .add-to-cart {
            width: 100%;
            padding: 1rem;
            background: var(--gradient);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .add-to-cart:hover {
            background: var(--primary-dark);
            transform: scale(1.02);
        }

        /* Footer */
        footer {
            background: var(--dark);
            color: white;
            padding: 4rem 2rem;
            text-align: center;
            margin-top: 6rem;
        }

        footer p {
            opacity: 0.8;
            margin: 0.8rem 0;
            font-size: 1rem;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .navbar {
                padding: 1rem 2rem;
            }
            
            .navbar h1 {
                font-size: 1.8rem;
            }
            
            .hero-banner h2 {
                font-size: 2.8rem;
            }
            
            .products {
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
                gap: 2rem;
            }
        }

        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                gap: 1.5rem;
                padding: 1rem;
            }
            
            .navbar-right {
                flex-wrap: wrap;
                justify-content: center;
                gap: 1rem;
            }
            
            .nav-link, .cart-btn, .checkout-link {
                padding: 0.6rem 1.2rem;
                font-size: 0.9rem;
            }
            
            .hero-banner {
                padding: 5rem 1.5rem;
            }
            
            .hero-banner h2 {
                font-size: 2.2rem;
            }
            
            .hero-banner p {
                font-size: 1.1rem;
            }
            
            .main-content {
                padding: 0 1.5rem 4rem;
            }
            
            .products {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                gap: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .products {
                grid-template-columns: 1fr;
            }
            
            .section-title {
                font-size: 2rem;
            }
            
            .cta-button {
                padding: 1rem 2rem;
                font-size: 1rem;
            }
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .product-card {
            animation: fadeIn 0.6s ease-out forwards;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <h1>Mashallah Boutique</h1>
        <div class="navbar-right">
            <a href="index.html" class="nav-link active">Home</a>
            <a href="about.html" class="nav-link">About</a>
            <a href="contact.html" class="nav-link">Contact</a>
            <a href="cart.html" class="cart-btn">
                <i class="fas fa-shopping-cart"></i>
                Cart <span id="cart-count">0</span>
            </a>
            <a href="checkout.html" class="checkout-link">Checkout</a>
        </div>
    </nav>

    <div class="hero-banner">
        <h2>Premium Modest Fashion</h2>
        <p>Discover our exclusive collection of elegant abayas, hijabs, and modest wear. Quality craftsmanship meets timeless design.</p>
        <a href="#product-list" class="cta-button">Shop Now</a>
    </div>

    <div class="main-content">
        <h2 class="section-title" id="product-list">Featured Collection</h2>
        <section class="products">
            <!-- Products will load here from product.js -->
        </section>
    </div>

    <footer>
        <p>© 2026 Mashallah Boutique. All Rights Reserved. BY MA Developers</p>
    </footer>

    <script type="module" src="product.js"></script>
</body>
</html>
