<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel - Mashallah Boutique</title>
  <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    :root {
        --primary-blue: #1e40af;
        --dark-blue: #1e3a8a;
        --light-blue: #3b82f6;
        --black: #0f172a;
        --dark-gray: #1e293b;
        --light-gray: #f1f5f9;
        --white: #ffffff;
        --success: #10b981;
        --danger: #ef4444;
        --warning: #f59e0b;
    }

    body {
        font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
        background: linear-gradient(135deg, #000000 0%, #0f172a 100%);
        color: var(--white);
        min-height: 100vh;
        line-height: 1.6;
    }

    /* Navbar */
    .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: linear-gradient(135deg, var(--black) 0%, var(--dark-blue) 100%);
        color: white;
        padding: 18px 40px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        position: sticky;
        top: 0;
        z-index: 1000;
        border-bottom: 2px solid var(--light-blue);
    }

    .navbar h1 {
        font-size: 26px;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa 0%, var(--light-blue) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }

    .navbar .btn {
        background: linear-gradient(135deg, var(--primary-blue) 0%, var(--dark-blue) 100%);
        color: white;
        border: none;
        padding: 10px 24px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        font-size: 15px;
        transition: all 0.3s ease;
        box-shadow: 0 4px 12px rgba(30, 64, 175, 0.3);
    }

    .navbar .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 18px rgba(30, 64, 175, 0.4);
        background: linear-gradient(135deg, var(--light-blue) 0%, var(--primary-blue) 100%);
    }

    /* Main Content */
    main {
        max-width: 1400px;
        margin: 40px auto;
        padding: 0 30px;
    }

    /* Sections */
    section {
        background: linear-gradient(145deg, rgba(30, 41, 59, 0.8) 0%, rgba(15, 23, 42, 0.9) 100%);
        padding: 30px;
        border-radius: 16px;
        margin-bottom: 40px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(59, 130, 246, 0.2);
        backdrop-filter: blur(10px);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    section:hover {
        transform: translateY(-5px);
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(59, 130, 246, 0.3);
    }

    h2 {
        margin-bottom: 25px;
        color: var(--white);
        font-size: 24px;
        font-weight: 700;
        padding-bottom: 15px;
        border-bottom: 2px solid rgba(59, 130, 246, 0.3);
    }

    /* Add Product Section */
    #add-product {
        position: relative;
        overflow: hidden;
    }

    #add-product input {
        width: 100%;
        padding: 14px 16px;
        margin-bottom: 20px;
        background: rgba(0, 0, 0, 0.5);
        border: 2px solid rgba(59, 130, 246, 0.2);
        border-radius: 10px;
        font-size: 15px;
        color: var(--white);
        transition: all 0.3s ease;
        font-family: inherit;
    }

    #add-product input::placeholder {
        color: #94a3b8;
        opacity: 0.8;
    }

    #add-product input:focus {
        outline: none;
        border-color: var(--light-blue);
        box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
        background: rgba(0, 0, 0, 0.7);
    }

    #add-product input[type="file"] {
        padding: 12px;
        border: 2px dashed rgba(59, 130, 246, 0.4);
        background: rgba(30, 64, 175, 0.1);
        cursor: pointer;
    }

    #add-product input[type="file"]:hover {
        border-color: var(--light-blue);
        background: rgba(30, 64, 175, 0.2);
    }

    #add-product button {
        background: linear-gradient(135deg, var(--primary-blue) 0%, var(--dark-blue) 100%);
        color: white;
        border: none;
        padding: 16px;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        width: 100%;
        transition: all 0.3s ease;
        margin-top: 10px;
    }

    #add-product button:hover {
        background: linear-gradient(135deg, var(--light-blue) 0%, var(--primary-blue) 100%);
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(30, 64, 175, 0.4);
    }

    /* Preview Image */
    #preview {
        text-align: center;
        margin-top: 20px;
    }

    #preview img {
        max-width: 250px;
        max-height: 250px;
        border-radius: 12px;
        margin-top: 15px;
        border: 3px solid rgba(59, 130, 246, 0.3);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        transition: transform 0.3s ease;
    }

    #preview img:hover {
        transform: scale(1.05);
    }

    /* Products List */
    #product-list-admin.products {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 35px;
        padding: 20px 0;
    }

    .product-card {
        background: linear-gradient(145deg, rgba(30, 41, 59, 0.8) 0%, rgba(15, 23, 42, 0.9) 100%);
        border-radius: 16px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        overflow: hidden;
        text-align: center;
        transition: all 0.3s ease;
        border: 1px solid rgba(59, 130, 246, 0.2);
    }

    .product-card:hover {
        transform: translateY(-10px) scale(1.02);
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(59, 130, 246, 0.3);
    }

    .product-card img {
        width: 100%;
        height: 220px;
        object-fit: cover;
        transition: transform 0.5s ease;
    }

    .product-card:hover img {
        transform: scale(1.05);
    }

    .product-card h3 {
        margin: 10px 0 5px 0;
        padding: 0 15px;
        font-size: 1.2rem;
        color: var(--white);
        font-weight: 600;
    }

    .product-card p {
        margin: 5px 0;
        padding: 0 15px;
        color: #cbd5e1;
        font-size: 0.95rem;
    }

    .product-card .price {
        margin: 10px 0;
        font-size: 1.5rem;
        font-weight: 800;
        color: #60a5fa;
        background: linear-gradient(135deg, #60a5fa 0%, var(--light-blue) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }

    .product-card button {
        margin: 10px 0 20px;
        background: var(--danger);
        border: none;
        color: #fff;
        padding: 8px 15px;
        border-radius: 5px;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.3s ease;
    }

    .product-card button:hover {
        background: #dc2626;
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
    }

    /* Orders List */
    #orders-list {
        background: rgba(30, 41, 59, 0.5);
        padding: 20px;
        border-radius: 12px;
        min-height: 200px;
    }

    .order-item {
        background: linear-gradient(145deg, rgba(30, 41, 59, 0.7) 0%, rgba(15, 23, 42, 0.8) 100%);
        padding: 20px;
        margin-bottom: 20px;
        border-radius: 12px;
        border-left: 5px solid var(--light-blue);
        transition: all 0.3s ease;
    }

    .order-item:hover {
        transform: translateX(5px);
        border-left-color: var(--primary-blue);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .order-item h3 {
        font-size: 17px;
        margin-bottom: 10px;
        color: var(--white);
    }

    .order-item p {
        color: #cbd5e1;
        font-size: 14px;
        margin-bottom: 8px;
    }

    /* Stats Cards */
    .stats-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 25px;
        margin-bottom: 40px;
    }

    .stat-card {
        background: linear-gradient(145deg, rgba(30, 41, 59, 0.8) 0%, rgba(15, 23, 42, 0.9) 100%);
        padding: 25px;
        border-radius: 16px;
        text-align: center;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(59, 130, 246, 0.2);
        transition: all 0.3s ease;
    }

    .stat-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
        border-color: rgba(59, 130, 246, 0.4);
    }

    .stat-card h3 {
        font-size: 28px;
        margin-bottom: 10px;
        color: var(--white);
    }

    .stat-card p {
        color: #cbd5e1;
        font-size: 15px;
    }

    /* Responsive */
    @media (max-width: 768px) {
        .navbar {
            padding: 15px 20px;
            flex-direction: column;
            gap: 15px;
            text-align: center;
        }
        
        main {
            padding: 0 20px;
            margin: 25px auto;
        }
        
        section {
            padding: 25px;
            margin-bottom: 30px;
        }
        
        #product-list-admin.products {
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 25px;
        }
        
        .stats-container {
            grid-template-columns: 1fr;
        }
    }

    @media (max-width: 480px) {
        .navbar h1 {
            font-size: 22px;
        }
        
        h2 {
            font-size: 20px;
        }
        
        section {
            padding: 20px;
        }
        
        #product-list-admin.products {
            grid-template-columns: 1fr;
        }
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
        width: 10px;
    }

    ::-webkit-scrollbar-track {
        background: var(--black);
    }

    ::-webkit-scrollbar-thumb {
        background: linear-gradient(135deg, var(--light-blue) 0%, var(--primary-blue) 100%);
        border-radius: 5px;
    }

    ::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(135deg, var(--primary-blue) 0%, var(--dark-blue) 100%);
    }

    /* Animations */
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    section {
        animation: fadeIn 0.6s ease-out;
    }

    .product-card {
        animation: fadeIn 0.6s ease-out;
    }

    /* Input focus animation */
    #add-product input:focus {
        animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
        0% { box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15); }
        50% { box-shadow: 0 0 0 6px rgba(59, 130, 246, 0.25); }
        100% { box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15); }
    }

    /* Button click effect */
    .navbar .btn:active,
    #add-product button:active,
    .product-card button:active {
        transform: translateY(0);
    }

    /* Shimmer effect for add product section */
    #add-product::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 3px;
        background: linear-gradient(90deg, transparent, var(--light-blue), transparent);
        animation: shimmer 3s infinite;
    }

    @keyframes shimmer {
        0% { left: -100%; }
        100% { left: 100%; }
    }

    /* Card stagger animation */
    .product-card:nth-child(1) { animation-delay: 0.1s; }
    .product-card:nth-child(2) { animation-delay: 0.2s; }
    .product-card:nth-child(3) { animation-delay: 0.3s; }
    .product-card:nth-child(4) { animation-delay: 0.4s; }

    /* Order item animation */
    .order-item {
        animation: slideInRight 0.5s ease-out;
    }

    @keyframes slideInRight {
        from { opacity: 0; transform: translateX(20px); }
        to { opacity: 1; transform: translateX(0); }
    }

    .order-item:nth-child(1) { animation-delay: 0.1s; }
    .order-item:nth-child(2) { animation-delay: 0.2s; }
    .order-item:nth-child(3) { animation-delay: 0.3s; }

    /* Stats cards animation */
    .stat-card {
        animation: fadeInUp 0.6s ease-out;
    }

    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .stat-card:nth-child(1) { animation-delay: 0.1s; }
    .stat-card:nth-child(2) { animation-delay: 0.2s; }
    .stat-card:nth-child(3) { animation-delay: 0.3s; }
    .stat-card:nth-child(4) { animation-delay: 0.4s; }
  </style>
</head>
<body>
  <nav class="navbar">
    <h1>Admin Panel</h1>
    <button onclick="logout()" class="btn">Logout</button>
  </nav>

  <main>
    <!-- Stats Cards -->
    <div class="stats-container">
      <div class="stat-card">
        <h3 id="total-products">0</h3>
        <p>Total Products</p>
      </div>
      <div class="stat-card">
        <h3 id="total-orders">0</h3>
        <p>Total Orders</p>
      </div>
      <div class="stat-card">
        <h3 id="total-revenue">$0</h3>
        <p>Total Revenue</p>
      </div>
      <div class="stat-card">
        <h3 id="total-customers">0</h3>
        <p>Total Customers</p>
      </div>
    </div>

    <!-- Add Product Section -->
    <section id="add-product">
      <h2>Add Product</h2>
      <input type="text" id="pname" placeholder="Product Name">
      <input type="text" id="pdesc" placeholder="Description">
      <input type="number" id="pprice" placeholder="Price">
      <input type="file" id="pimage" accept="image/*">
      <button onclick="addProduct()">Upload Product</button>
      <div id="preview" style="margin-top:10px;"></div>
    </section>

    <!-- Products List -->
    <section>
      <h2>Products</h2>
      <div id="product-list-admin" class="products"></div>
    </section>

    <!-- Orders List -->
    <section>
      <h2>Orders</h2>
      <div id="orders-list"></div>
    </section>
  </main>

  <script type="module" src="admin-panel.js"></script>
</body>
</html>
