<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel - Mashallah Boutique</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: white;
      min-height: 100vh;
    }

    /* Navbar */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.95);
      padding: 20px 40px;
      border-bottom: 2px solid #3b82f6;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .navbar h1 {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .navbar .btn {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 15px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    .navbar .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.4);
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
    }

    /* Main Container */
    .container {
      max-width: 1400px;
      margin: 30px auto;
      padding: 0 20px;
    }

    /* Stats Row */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: rgba(30, 41, 59, 0.8);
      padding: 25px;
      border-radius: 12px;
      text-align: center;
      border-left: 5px solid #3b82f6;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .stat-card h3 {
      font-size: 32px;
      margin-bottom: 10px;
      color: white;
    }

    .stat-card p {
      color: #cbd5e1;
      font-size: 15px;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: rgba(30, 41, 59, 0.8);
      color: #cbd5e1;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .tab-btn:hover {
      background: rgba(59, 130, 246, 0.2);
      color: white;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: white;
    }

    /* Tab Content */
    .tab-content {
      display: none;
      background: rgba(30, 41, 59, 0.8);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .tab-content.active {
      display: block;
    }

    /* Form Styling */
    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #cbd5e1;
      font-weight: 500;
    }

    .form-control {
      width: 100%;
      padding: 14px;
      background: rgba(15, 23, 42, 0.7);
      border: 2px solid rgba(59, 130, 246, 0.3);
      border-radius: 8px;
      color: white;
      font-size: 15px;
    }

    .form-control:focus {
      outline: none;
      border-color: #3b82f6;
    }

    .submit-btn {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      transform: translateY(-2px);
    }

    /* Products Grid */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .product-card {
      background: rgba(15, 23, 42, 0.7);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(59, 130, 246, 0.2);
      transition: all 0.3s ease;
    }

    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
    }

    .product-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .product-card .content {
      padding: 20px;
    }

    .product-card h4 {
      font-size: 18px;
      margin-bottom: 10px;
      color: white;
    }

    .product-card .price {
      font-size: 20px;
      font-weight: 700;
      color: #60a5fa;
      margin-bottom: 15px;
    }

    .delete-btn {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .delete-btn:hover {
      background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
    }

    /* Orders Table */
    .orders-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    .orders-table th {
      background: rgba(15, 23, 42, 0.9);
      padding: 15px;
      text-align: left;
      color: #cbd5e1;
      font-weight: 600;
      border-bottom: 2px solid rgba(59, 130, 246, 0.3);
    }

    .orders-table td {
      padding: 15px;
      border-bottom: 1px solid rgba(59, 130, 246, 0.1);
      color: #e2e8f0;
    }

    .status-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }

    .status-pending {
      background: rgba(245, 158, 11, 0.2);
      color: #fbbf24;
    }

    .status-delivered {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
    }

    .action-btn {
      padding: 6px 12px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      margin-right: 5px;
      transition: all 0.3s ease;
    }

    .btn-success {
      background: #10b981;
      color: white;
    }

    .btn-warning {
      background: #f59e0b;
      color: white;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 40px;
      color: #cbd5e1;
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(59, 130, 246, 0.3);
      border-radius: 50%;
      border-top-color: #3b82f6;
      animation: spin 1s linear infinite;
      margin-right: 10px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Responsive */
    @media (max-width: 768px) {
      .navbar {
        flex-direction: column;
        gap: 15px;
        padding: 20px;
      }
      
      .container {
        padding: 0 15px;
      }
      
      .stats-row {
        grid-template-columns: 1fr;
      }
      
      .products-grid {
        grid-template-columns: 1fr;
      }
      
      .orders-table {
        display: block;
        overflow-x: auto;
      }
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <h1>Admin Dashboard</h1>
    <button onclick="logout()" class="btn">Logout</button>
  </nav>

  <!-- Main Container -->
  <div class="container">
    <!-- Stats Cards -->
    <div class="stats-row">
      <div class="stat-card">
        <h3 id="total-products">0</h3>
        <p>Total Products</p>
      </div>
      <div class="stat-card">
        <h3 id="total-orders">0</h3>
        <p>Total Orders</p>
      </div>
      <div class="stat-card">
        <h3 id="total-revenue">₹0</h3>
        <p>Total Revenue</p>
      </div>
      <div class="stat-card">
        <h3 id="total-customers">0</h3>
        <p>Total Customers</p>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" onclick="showTab('dashboard')">Dashboard</button>
      <button class="tab-btn" onclick="showTab('add-product')">Add Product</button>
      <button class="tab-btn" onclick="showTab('products')">Manage Products</button>
      <button class="tab-btn" onclick="showTab('orders')">Manage Orders</button>
    </div>

    <!-- Dashboard Tab -->
    <div id="dashboard-tab" class="tab-content active">
      <h2>Dashboard Overview</h2>
      <div class="loading" id="dashboard-loading">
        <span class="spinner"></span> Loading dashboard...
      </div>
      <div id="dashboard-content" style="display: none;">
        <!-- Dashboard content will be loaded here -->
      </div>
    </div>

    <!-- Add Product Tab -->
    <div id="add-product-tab" class="tab-content">
      <h2>Add New Product</h2>
      <div class="form-group">
        <label>Product Name</label>
        <input type="text" id="pname" class="form-control" placeholder="Enter product name">
      </div>
      <div class="form-group">
        <label>Description</label>
        <input type="text" id="pdesc" class="form-control" placeholder="Enter product description">
      </div>
      <div class="form-group">
        <label>Price (₹)</label>
        <input type="number" id="pprice" class="form-control" placeholder="Enter price">
      </div>
      <div class="form-group">
        <label>Product Image</label>
        <input type="file" id="pimage" class="form-control" accept="image/*">
      </div>
      <div id="preview" style="margin: 20px 0; text-align: center;"></div>
      <button onclick="addProduct()" class="submit-btn">Add Product</button>
    </div>

    <!-- Products Tab -->
    <div id="products-tab" class="tab-content">
      <h2>Manage Products</h2>
      <div class="loading" id="products-loading">
        <span class="spinner"></span> Loading products...
      </div>
      <div class="products-grid" id="product-list-admin"></div>
    </div>

    <!-- Orders Tab -->
    <div id="orders-tab" class="tab-content">
      <h2>Manage Orders</h2>
      <div class="loading" id="orders-loading">
        <span class="spinner"></span> Loading orders...
      </div>
      <table class="orders-table" id="orders-table">
        <thead>
          <tr>
            <th>Order ID</th>
            <th>Customer</th>
            <th>Amount</th>
            <th>Status</th>
            <th>Date</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="orders-list">
          <!-- Orders will be loaded here -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Link to your JavaScript file -->
  <script type="module" src="admin-panel.js"></script>
</body>
</html>
