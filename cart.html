
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your Cart - Mashallah Boutique</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        /* E-commerce Theme - Same as index */
        :root {
            --primary: #e63946;
            --primary-dark: #d62828;
            --secondary: #2a9d8f;
            --dark: #1a1a2e;
            --light: #f8f9fa;
            --light-gray: #e9ecef;
            --gradient: linear-gradient(135deg, #e63946 0%, #ff6b6b 100%);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            --shadow-hover: 0 20px 50px rgba(230, 57, 70, 0.15);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #fefefe;
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
        }

        /* Navigation - Same as index */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 1.2rem 4rem;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.05);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 3px solid var(--primary);
        }

        .navbar h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 2rem;
            font-weight: 900;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .navbar-right {
            display: flex;
            align-items: center;
            gap: 1.8rem;
        }

        .nav-link {
            color: var(--dark);
            text-decoration: none;
            font-weight: 500;
            padding: 0.7rem 1.5rem;
            border-radius: 8px;
            transition: var(--transition);
            position: relative;
        }

        .nav-link:hover {
            color: var(--primary);
            background: rgba(230, 57, 70, 0.05);
        }

        .nav-link.active {
            color: var(--primary);
            font-weight: 600;
            background: rgba(230, 57, 70, 0.05);
        }

        .cart-btn {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.8rem 1.8rem;
            background: var(--gradient);
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
            position: relative;
            box-shadow: 0 5px 20px rgba(230, 57, 70, 0.2);
        }

        .cart-btn:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
        }

        #cart-count {
            background: white;
            color: var(--primary);
            font-size: 0.9rem;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            top: -8px;
            right: -8px;
            font-weight: 700;
        }

        .checkout-link {
            padding: 0.8rem 1.8rem;
            background: var(--dark);
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
            box-shadow: 0 5px 20px rgba(26, 26, 46, 0.2);
        }

        .checkout-link:hover {
            background: #151525;
            transform: translateY(-3px);
        }

        /* Cart Container */
        .cart-container {
            max-width: 1200px;
            margin: 4rem auto;
            padding: 0 2rem;
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
        }

        .cart-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.8rem;
            color: var(--dark);
        }

        .continue-shopping {
            padding: 0.8rem 2rem;
            background: var(--light);
            color: var(--dark);
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: var(--transition);
            border: 2px solid var(--light-gray);
        }

        .continue-shopping:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            transform: translateY(-3px);
        }

        /* Empty Cart */
        .empty-cart {
            text-align: center;
            padding: 6rem 2rem;
            background: white;
            border-radius: 15px;
            box-shadow: var(--shadow);
        }

        .empty-cart-icon {
            font-size: 5rem;
            color: var(--light-gray);
            margin-bottom: 2rem;
        }

        .empty-cart h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: var(--dark);
        }

        .empty-cart p {
            color: #666;
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }

        .shop-now-btn {
            display: inline-block;
            padding: 1rem 3rem;
            background: var(--gradient);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1.1rem;
            transition: var(--transition);
        }

        .shop-now-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(230, 57, 70, 0.3);
        }

        /* Cart Content */
        .cart-content {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 3rem;
        }

        /* Cart Items */
        .cart-items {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .cart-item {
            background: white;
            border-radius: 15px;
            padding: 2rem;
            box-shadow: var(--shadow);
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 2rem;
            align-items: center;
            transition: var(--transition);
        }

        .cart-item:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
        }

        .cart-item-image {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 10px;
        }

        .item-details h3 {
            font-size: 1.3rem;
            margin-bottom: 0.8rem;
            color: var(--dark);
            font-weight: 600;
        }

        .item-price {
            font-size: 1.5rem;
            color: var(--primary);
            font-weight: 700;
            margin-bottom: 1.5rem;
        }

        .item-price::before {
            content: 'PKR ';
            font-size: 1rem;
            opacity: 0.8;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .quantity-btn {
            width: 40px;
            height: 40px;
            border: none;
            background: var(--light);
            color: var(--dark);
            border-radius: 8px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .quantity-btn:hover {
            background: var(--primary);
            color: white;
        }

        .quantity {
            font-size: 1.2rem;
            font-weight: 600;
            min-width: 40px;
            text-align: center;
        }

        .remove-btn {
            padding: 0.6rem 1.5rem;
            background: #ff4444;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .remove-btn:hover {
            background: #cc0000;
            transform: translateY(-2px);
        }

        .item-total {
            text-align: right;
        }

        .item-total-price {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--dark);
        }

        .item-total-price::before {
            content: 'PKR ';
            font-size: 1rem;
            opacity: 0.8;
        }

        /* Cart Summary */
        .cart-summary {
            background: white;
            border-radius: 15px;
            padding: 2.5rem;
            box-shadow: var(--shadow);
            position: sticky;
            top: 120px;
            height: fit-content;
        }

        .cart-summary h2 {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.8rem;
            margin-bottom: 2rem;
            color: var(--dark);
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--light-gray);
        }

        .summary-row:last-child {
            border-bottom: none;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 2px solid var(--light-gray);
        }

        .summary-label {
            color: #666;
            font-weight: 500;
        }

        .summary-value {
            font-weight: 600;
            color: var(--dark);
        }

        .total .summary-value {
            font-size: 1.8rem;
            color: var(--primary);
        }

        .checkout-btn {
            width: 100%;
            padding: 1.2rem;
            background: var(--gradient);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 1.5rem;
        }

        .checkout-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(230, 57, 70, 0.3);
        }

        .checkout-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Promo Code */
        .promo-code {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid var(--light-gray);
        }

        .promo-code h3 {
            font-size: 1.1rem;
            margin-bottom: 1rem;
            color: var(--dark);
        }

        .promo-input {
            display: flex;
            gap: 1rem;
        }

        .promo-input input {
            flex: 1;
            padding: 0.8rem 1rem;
            border: 2px solid var(--light-gray);
            border-radius: 8px;
            font-size: 1rem;
        }

        .apply-btn {
            padding: 0.8rem 1.5rem;
            background: var(--dark);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .apply-btn:hover {
            background: #151525;
        }

        /* Footer - Same as index */
        footer {
            background: var(--dark);
            color: white;
            padding: 4rem 2rem;
            text-align: center;
            margin-top: 6rem;
        }

        footer p {
            opacity: 0.8;
            margin: 0.8rem 0;
            font-size: 1rem;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .navbar {
                padding: 1rem 2rem;
            }
            
            .cart-content {
                grid-template-columns: 1fr;
                gap: 2rem;
            }
            
            .cart-summary {
                position: static;
            }
        }

        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                gap: 1.5rem;
                padding: 1rem;
            }
            
            .navbar-right {
                flex-wrap: wrap;
                justify-content: center;
                gap: 1rem;
            }
            
            .cart-container {
                padding: 0 1.5rem;
                margin: 2rem auto;
            }
            
            .cart-header {
                flex-direction: column;
                gap: 1.5rem;
                text-align: center;
            }
            
            .cart-title {
                font-size: 2.2rem;
            }
            
            .cart-item {
                grid-template-columns: 1fr;
                text-align: center;
                gap: 1.5rem;
            }
            
            .cart-item-image {
                width: 100%;
                height: 200px;
            }
            
            .quantity-controls {
                justify-content: center;
            }
            
            .item-total {
                text-align: center;
            }
        }

        @media (max-width: 480px) {
            .cart-title {
                font-size: 1.8rem;
            }
            
            .empty-cart h2 {
                font-size: 1.5rem;
            }
            
            .promo-input {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <h1>Mashallah Boutique</h1>
        <div class="navbar-right">
            <a href="index.html" class="nav-link">Home</a>
            <a href="about.html" class="nav-link">About</a>
            <a href="contact.html" class="nav-link">Contact</a>
            <a href="cart.html" class="cart-btn active">
                <i class="fas fa-shopping-cart"></i>
                Cart <span id="cart-count">0</span>
            </a>
            <a href="checkout.html" class="checkout-link">Checkout</a>
        </div>
    </nav>

    <div class="cart-container">
        <div class="cart-header">
            <h1 class="cart-title">Your Shopping Cart</h1>
            <a href="index.html" class="continue-shopping">
                <i class="fas fa-arrow-left"></i> Continue Shopping
            </a>
        </div>

        <div id="cart-content">
            <!-- Cart content will be loaded by JavaScript -->
        </div>
    </div>

    <footer>
        <p>© 2026 Mashallah Boutique. All Rights Reserved.</p>
        <p>Premium Modest Fashion | Prices in PKR</p>
        <p>Sector 11/2, Orangi Town, Karachi | +92 314 2007505</p>
    </footer>

    <script>
        // Load cart page
        document.addEventListener('DOMContentLoaded', function() {
            loadCartPage();
        });

        function loadCartPage() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const cartContent = document.getElementById('cart-content');
            
            if (cart.length === 0) {
                cartContent.innerHTML = `
                    <div class="empty-cart">
                        <div class="empty-cart-icon">
                            <i class="fas fa-shopping-cart"></i>
                        </div>
                        <h2>Your cart is empty</h2>
                        <p>Looks like you haven't added any items to your cart yet.</p>
                        <a href="index.html" class="shop-now-btn">Start Shopping</a>
                    </div>
                `;
                return;
            }
            
            let subtotal = 0;
            let itemsHTML = '';
            let totalItems = 0;
            
            cart.forEach((item, index) => {
                const itemTotal = item.price * item.quantity;
                subtotal += itemTotal;
                totalItems += item.quantity;
                
                itemsHTML += `
                    <div class="cart-item" data-index="${index}">
                        <img src="${item.image}" alt="${item.name}" class="cart-item-image">
                        <div class="item-details">
                            <h3>${item.name}</h3>
                            <div class="item-price">${item.price}</div>
                            <div class="quantity-controls">
                                <button class="quantity-btn" onclick="updateQuantity(${index}, -1)">
                                    <i class="fas fa-minus"></i>
                                </button>
                                <span class="quantity">${item.quantity}</span>
                                <button class="quantity-btn" onclick="updateQuantity(${index}, 1)">
                                    <i class="fas fa-plus"></i>
                                </button>
                                <button class="remove-btn" onclick="removeFromCart(${index})">
                                    <i class="fas fa-trash"></i> Remove
                                </button>
                            </div>
                        </div>
                        <div class="item-total">
                            <div class="item-total-price">${itemTotal}</div>
                            <p>${item.quantity} × PKR ${item.price}</p>
                        </div>
                    </div>
                `;
            });
            
            cartContent.innerHTML = `
                <div class="cart-content">
                    <div class="cart-items">
                        ${itemsHTML}
                    </div>
                    <div class="cart-summary">
                        <h2>Order Summary</h2>
                        <div class="summary-row">
                            <span class="summary-label">Subtotal (${totalItems} items)</span>
                            <span class="summary-value">PKR ${subtotal}</span>
                        </div>
                        <div class="summary-row">
                            <span class="summary-label">Shipping</span>
                            <span class="summary-value">Free</span>
                        </div>
                        <div class="summary-row total">
                            <span class="summary-label">Total</span>
                            <span class="summary-value">PKR ${subtotal}</span>
                        </div>
                        <a href="checkout.html" class="checkout-btn">
                            Proceed to Checkout
                        </a>
                        <div class="promo-code">
                            <h3>Have a promo code?</h3>
                            <div class="promo-input">
                                <input type="text" placeholder="Enter promo code">
                                <button class="apply-btn">Apply</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function updateQuantity(index, change) {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            cart[index].quantity += change;
            
            if (cart[index].quantity <= 0) {
                cart.splice(index, 1);
            }
            
            localStorage.setItem('cart', JSON.stringify(cart));
            loadCartPage();
            updateCartCount();
        }

        function removeFromCart(index) {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            cart.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            loadCartPage();
            updateCartCount();
        }

        function updateCartCount() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const totalItems = cart.reduce((total, item) => total + item.quantity, 0);
            document.getElementById('cart-count').textContent = totalItems;
        }

        // Initialize
        updateCartCount();
    </script>
</body>
</html>
