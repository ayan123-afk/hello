
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #000000 0%, #000814 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: white;
        }

        .login-container {
            background: rgba(15, 25, 45, 0.9);
            padding: 40px 35px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(59, 130, 246, 0.2);
        }

        .login-container h1 {
            color: #ffffff;
            margin-bottom: 35px;
            font-size: 28px;
            font-weight: 600;
            text-align: center;
        }

        .input-group {
            margin-bottom: 25px;
        }

        .label-with-icon {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 500;
        }

        .label-icon {
            color: #3b82f6;
            font-size: 18px;
        }

        .login-container input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 8px;
            font-size: 15px;
            color: #ffffff;
            font-family: inherit;
        }

        .login-container input::placeholder {
            color: #94a3b8;
            opacity: 0.8;
        }

        .login-container input:focus {
            outline: none;
            border-color: #3b82f6;
            background: rgba(0, 0, 0, 0.7);
        }

        .login-container button {
            width: 100%;
            padding: 15px;
            background: #1d4ed8;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .login-container button:hover {
            background: #2563eb;
        }

        .back-link {
            display: block;
            margin-top: 25px;
            color: #cbd5e1;
            text-decoration: none;
            font-size: 14px;
            text-align: center;
            padding: 10px;
            border-radius: 6px;
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(59, 130, 246, 0.2);
        }

        .back-link:hover {
            color: #ffffff;
            background: rgba(30, 64, 175, 0.2);
            border-color: rgba(59, 130, 246, 0.4);
        }

        .back-link::before {
            content: "←";
            margin-right: 8px;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 20px;
            color: #3b82f6;
            text-align: center;
        }

        /* Simple and clean design */
        .login-form {
            width: 100%;
        }

        /* Responsive design */
        @media (max-width: 480px) {
            .login-container {
                padding: 30px 25px;
                max-width: 90%;
            }
            
            .login-container h1 {
                font-size: 24px;
                margin-bottom: 30px;
            }
            
            .logo {
                font-size: 40px;
                margin-bottom: 15px;
            }
            
            .login-container input {
                padding: 12px 14px;
                font-size: 14px;
            }
            
            .login-container button {
                padding: 14px;
                font-size: 15px;
            }
            
            .back-link {
                font-size: 13px;
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">🔐</div>
        <h1>Admin Login</h1>
        
        <form class="login-form" action="#" method="POST">
            <div class="input-group">
                <div class="label-with-icon">
                    <span class="label-icon">👤</span>
                    <span>Username</span>
                </div>
                <input type="text" id="username" name="username" placeholder="Enter admin username" required>
            </div>
            
            <div class="input-group">
                <div class="label-with-icon">
                    <span class="label-icon">🔒</span>
                    <span>Password</span>
                </div>
                <input type="password" id="password" name="password" placeholder="Enter admin password" required>
            </div>
            
            <button type="submit">LOGIN</button>
        </form>
        
        <a href="index.html" class="back-link">Back to Store</a>
    </div>
</body>
</html>
