<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Checkout - Mashallah Boutique</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f7f7f7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .navbar {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ff5c5c;
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .navbar h1 {
            font-size: 24px;
            font-weight: bold;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            background: #000;
            padding: 8px 15px;
            border-radius: 5px;
            transition: 0.3s;
        }

        .navbar a:hover {
            background: #333;
        }

        .checkout-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            transition: 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #ff5c5c;
            box-shadow: 0 0 0 2px rgba(255,92,92,0.2);
        }

        button {
            width: 100%;
            padding: 15px;
            background: #ff5c5c;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background: #e04c4c;
            transform: translateY(-2px);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .cart-summary {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            border-left: 4px solid #ff5c5c;
        }

        .cart-summary p {
            margin: 10px 0;
            font-size: 16px;
        }

        .cart-summary strong {
            color: #ff5c5c;
        }

        footer {
            margin-top: 40px;
            text-align: center;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <h1>Mashallah Boutique - Checkout</h1>
        <a href="index.html">Back to Shop</a>
    </nav>

    <div class="checkout-container">
        <h2>Complete Your Order</h2>
        
        <div class="cart-summary" id="cart-summary">
            <!-- Cart summary will load here -->
        </div>

        <form id="checkout-form">
            <div class="form-group">
                <label for="name">Full Name *</label>
                <input type="text" id="name" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address *</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number *</label>
                <input type="tel" id="phone" placeholder="03XX-XXXXXXX" required>
            </div>

            <div class="form-group">
                <label for="address">Complete Address *</label>
                <input type="text" id="address" placeholder="House #, Street, Area, City" required>
            </div>

            <button type="submit" id="submit-btn">Place Order</button>
        </form>
    </div>

    <footer>
        <p>© 2026 Mashallah Boutique. All Rights Reserved. | Prices in PKR</p>
    </footer>

    <script>
        // Load cart summary
        document.addEventListener('DOMContentLoaded', function() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const cartSummaryDiv = document.getElementById('cart-summary');
            const submitBtn = document.getElementById('submit-btn');
            
            if (cart.length === 0) {
                cartSummaryDiv.innerHTML = '<p style="color: #ff5c5c; text-align: center;">Your cart is empty!</p>';
                submitBtn.disabled = true;
                submitBtn.textContent = 'Cart is Empty';
                return;
            }
            
            let total = 0;
            let summaryHTML = '<h3>Order Summary</h3>';
            
            cart.forEach(item => {
                const itemTotal = item.price * item.quantity;
                total += itemTotal;
                summaryHTML += `<p>${item.name} x${item.quantity}: <strong>PKR ${itemTotal}</strong></p>`;
            });
            
            summaryHTML += `<p style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #ddd;"><strong>Total: PKR ${total}</strong></p>`;
            cartSummaryDiv.innerHTML = summaryHTML;
        });
    </script>

    <!-- Link to checkout.js -->
    <script type="module" src="checkout.js"></script>
</body>
</html>
