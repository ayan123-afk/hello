<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Checkout - Mashallah Boutique</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f7f7f7;
            min-height: 100vh;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ff5c5c;
            color: white;
            padding: 15px 30px;
        }

        .navbar h1 {
            font-size: 24px;
            font-weight: bold;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            background: #000;
            padding: 8px 15px;
            border-radius: 5px;
            transition: 0.3s;
        }

        .navbar a:hover {
            background: #333;
        }

        .checkout-container {
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            transition: 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #ff5c5c;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #ff5c5c;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background: #e04c4c;
        }

        footer {
            text-align: center;
            padding: 25px 0;
            background: #222;
            color: #fff;
            margin-top: 60px;
        }

        footer p {
            margin: 0;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <h1>Mashallah Boutique - Checkout</h1>
        <a href="index.html">Back to Shop</a>
    </nav>

    <div class="checkout-container">
        <h2>Complete Your Order</h2>

        <form id="checkout-form">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="03XX-XXXXXXX" required>
            </div>

            <div class="form-group">
                <label for="address">Complete Address</label>
                <input type="text" id="address" placeholder="House #, Street, Area, City" required>
            </div>

            <button type="submit">Place Order</button>
        </form>
    </div>

    <footer>
        <p>© 2026 Mashallah Boutique. All Rights Reserved.</p>
    </footer>

    <!-- Only this one JavaScript link -->
    <script type="module" src="checkout.js"></script>
</body>
</html>
